[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sift"
version = "0.5.0"
description = "MCP server that cross-references offshore leaks, sanctions, corporate registries, SEC filings, and court records"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    # mcp 2.x. The 1.x -> 2.x break (removal of the @server.list_tools() /
    # @server.call_tool() decorator API) is absorbed by sift/mcp_compat.py,
    # which keeps this server's hand-authored tool schemas rather than letting
    # 2.0 derive them from function signatures. Floor is 2.0 because that shim
    # targets the tool-manager API.
    "mcp>=2,<3",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sift"]

[project.scripts]
sift = "sift.server:main"
